name: Dispatch tagged release build

on:
  push:
    paths:
      - ".github/workflows/publish-temp-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build & Release on v1.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "albaintor/integration-sonyavr" --ref "v1.9.0"
